services:
  valkey:
    image: valkey/valkey-bundle:9-alpine
    container_name: rag-mart-valkey
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: rag-mart-backend
    environment:
      PORT: 4000
      VALKEY_URL: redis://valkey:6379
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
    depends_on:
      - valkey

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_BASE_URL: http://localhost:4000
    container_name: rag-mart-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
